[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devanagari-fonts"
version = "0.1.0"
description = "Bundled Devanagari font files with a small Python API for discovery and paths."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Nishant Mishrea", email = "nisantamisra00@gmail.com" }
]
keywords = ["devanagari", "fonts", "typography", "hindi", "marathi", "sanskrit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Fonts",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/nishantaMishra/devanagari-fonts"
Repository = "https://github.com/nishantaMishra/devanagari-fonts"
Issues = "https://github.com/nishantaMishra/devanagari-fonts/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devanagari_fonts = ["fonts/**/*", "py.typed"]
